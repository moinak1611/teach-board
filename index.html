<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teach Board — Interactive Whiteboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink-slate: #1c2733;
    --chalk-white: #f5f3ec;
    --chalk-yellow: #f4d35e;
    --chalk-mint: #7fd9c4;
    --chalk-coral: #ef8f6e;
    --panel-bg: #10171f;
    --panel-bg-2: #17212b;
    --panel-border: #2a3644;
    --board-black: #14210f;
    --board-black-line: rgba(255,255,255,0.05);
    --board-white: #fbfaf6;
    --board-white-line: rgba(20,33,15,0.06);
    --accent: #f4d35e;
    --danger: #ef6e6e;
    --app-bg: #0a0e13;
    --canvas-area-bg: #05070a;
    --radius: 10px;
    --font-ui: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  @font-face{
    font-family:'Space Grotesk';
    src: local('Space Grotesk');
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#0a0e13;
    font-family: var(--font-ui);
    color: var(--chalk-white);
    overflow:hidden;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  /* ===== Top bar ===== */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    background: linear-gradient(180deg, var(--panel-bg-2), var(--panel-bg));
    border-bottom: 1px solid var(--panel-border);
    flex-shrink:0;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.2px;
    white-space:nowrap;
  }
  .brand .dot{
    width:11px;height:11px;border-radius:50%;
    background: conic-gradient(var(--chalk-yellow), var(--chalk-coral), var(--chalk-mint), var(--chalk-yellow));
  }
  .page-nav{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius: var(--radius);
    padding:5px 8px;
  }
  .page-nav button{
    background:transparent;
    border:none;
    color: var(--chalk-white);
    font-size:16px;
    cursor:pointer;
    padding:4px 8px;
    border-radius:6px;
  }
  .page-nav button:hover{ background: var(--panel-bg-2); }
  .page-nav button:disabled{ opacity:0.3; cursor:default; }
  #pageLabel{
    font-family: var(--font-mono);
    font-size:13px;
    min-width:78px;
    text-align:center;
    color: var(--chalk-yellow);
  }
  .top-actions{ display:flex; gap:8px; align-items:center; }
  .btn{
    background: var(--panel-bg);
    border:1px solid var(--panel-border);
    color: var(--chalk-white);
    padding:8px 14px;
    border-radius: var(--radius);
    font-size:13px;
    font-family: var(--font-ui);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    transition: border-color .15s ease, transform .1s ease;
  }
  .btn:hover{ border-color: var(--chalk-yellow); }
  .btn:active{ transform: scale(0.96); }
  .btn.primary{
    background: var(--chalk-yellow);
    color:#1c1c1c;
    border-color: var(--chalk-yellow);
    font-weight:600;
  }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.danger{ color: var(--danger); border-color: rgba(239,110,110,0.35); }
  .btn.danger:hover{ border-color: var(--danger); }

  /* ===== Body layout ===== */
  #body{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* ===== Left toolbar ===== */
  #toolbar{
    width:60px;
    flex-shrink:0;
    background: var(--panel-bg-2);
    border-right:1px solid var(--panel-border);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 0;
    gap:6px;
    overflow-y:auto;
  }
  .tool{
    width:44px; height:44px;
    border-radius: var(--radius);
    background:transparent;
    border:1px solid transparent;
    color: var(--chalk-white);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    font-size:16px;
  }
  .tool span{ font-size:9px; opacity:0.7; letter-spacing:0.3px; }
  .tool:hover{ background: rgba(255,255,255,0.06); }
  .tool.active{
    background: rgba(244,211,94,0.14);
    border-color: var(--chalk-yellow);
    color: var(--chalk-yellow);
  }
  .tool.active span{ opacity:1; }
  .sep{
    width:38px; height:1px;
    background: var(--panel-border);
    margin:6px 0;
  }

  /* ===== Canvas area ===== */
  #canvasWrap{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #05070a;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    overflow:hidden;
  }
  #boardStage{
    position:relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
    border-radius: 6px;
    overflow:hidden;
  }
  canvas{
    display:block;
    touch-action:none;
    cursor: crosshair;
  }
  #pageStamp{
    position:absolute;
    bottom:12px;
    right:16px;
    font-family: var(--font-mono);
    font-size:12px;
    padding:4px 10px;
    border-radius:20px;
    pointer-events:none;
    opacity:0.55;
  }

  /* ===== Right panel ===== */
  #rightpanel{
    width:170px;
    flex-shrink:0;
    background: var(--panel-bg-2);
    border-left:1px solid var(--panel-border);
    padding:16px 14px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .panel-block h4{
    margin:0 0 10px 0;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#7c8a99;
    font-weight:600;
  }
  .swatches{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:7px;
  }
  .swatch{
    width:100%; aspect-ratio:1;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    position:relative;
  }
  .swatch.active{ border-color:#fff; transform:scale(1.08); }
  #customColor{
    width:100%; height:30px; margin-top:9px;
    border:1px solid var(--panel-border);
    border-radius:6px; background:transparent; cursor:pointer;
  }
  .slider-row{ display:flex; align-items:center; gap:8px; }
  input[type=range]{ flex:1; accent-color: var(--chalk-yellow); }
  #sizePreviewWrap{
    display:flex; align-items:center; justify-content:center;
    height:40px; margin-top:6px;
    background: var(--panel-bg);
    border-radius:8px;
    border:1px solid var(--panel-border);
  }
  #sizePreview{ border-radius:50%; background: var(--chalk-white); }
  .board-toggle{
    display:flex; gap:8px;
  }
  .board-opt{
    flex:1;
    padding:10px 4px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    text-align:center;
    font-size:12px;
    cursor:pointer;
    background: var(--panel-bg);
  }
  .board-opt.active{ border-color: var(--chalk-yellow); color: var(--chalk-yellow); }
  .board-opt .swirl{
    width:100%; height:26px; border-radius:5px; margin-bottom:6px;
  }
  #pageThumbs{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:220px;
    overflow-y:auto;
    padding-right:2px;
  }
  .thumb{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    cursor:pointer;
    font-size:11px;
    background: var(--panel-bg);
  }
  .thumb.active{ border-color: var(--chalk-yellow); }
  .thumb-canvas{
    width:44px; height:28px;
    border-radius:3px;
    flex-shrink:0;
    object-fit:cover;
    background:#222;
  }
  .thumb-label{ flex:1; }
  .thumb-del{
    background:none; border:none; color:#7c8a99; cursor:pointer; font-size:13px;
  }
  .thumb-del:hover{ color: var(--danger); }

  #hint{
    font-size:11px;
    color:#5c6b7a;
    line-height:1.5;
    border-top:1px solid var(--panel-border);
    padding-top:12px;
  }

  #textInputLayer input{
    position:absolute;
    background:transparent;
    border:1px dashed var(--chalk-yellow);
    outline:none;
    font-family: var(--font-ui);
    padding:2px 4px;
    color:inherit;
  }

  #exportOverlay{
    position:fixed; inset:0;
    background:rgba(5,7,10,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    flex-direction:column;
    gap:14px;
  }
  #exportOverlay.show{ display:flex; }
  .spinner{
    width:38px; height:38px;
    border-radius:50%;
    border:3px solid rgba(244,211,94,0.2);
    border-top-color: var(--chalk-yellow);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #exportOverlay p{ font-size:13px; color:#cfd8e0; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#2a3644; border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 820px){
    #rightpanel{ display:none; }
    #toolbar{ width:58px; }
    .tool{ width:44px; height:44px; font-size:16px; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="brand"><span class="dot"></span> Teach Board</div>

    <div class="page-nav">
      <button id="prevPage" title="Previous page">◀</button>
      <span id="pageLabel">Page 1 / 1</span>
      <button id="nextPage" title="Next page">▶</button>
    </div>

    <div class="top-actions">
      <button class="btn" id="addPageBtn">➕ New board</button>
      <button class="btn" id="clearBtn">🧹 Clear</button>
      <button class="btn" id="undoBtn">↩ Undo</button>
      <button class="btn" id="redoBtn">↪ Redo</button>
      <button class="btn primary" id="exportBtn">⬇ Export all as PDF</button>
    </div>
  </div>

  <div id="body">

    <div id="toolbar">
      <button class="tool active" data-tool="pen" title="Pen">✏️<span>Pen</span></button>
      <button class="tool" data-tool="highlighter" title="Highlighter">🖊️<span>Highlight</span></button>
      <button class="tool" data-tool="eraser" title="Eraser">🧽<span>Erase</span></button>
      <div class="sep"></div>
      <button class="tool" data-tool="line" title="Straight line">📏<span>Line</span></button>
      <button class="tool" data-tool="rect" title="Rectangle">▭<span>Rect</span></button>
      <button class="tool" data-tool="circle" title="Circle">◯<span>Circle</span></button>
      <button class="tool" data-tool="arrow" title="Arrow">➜<span>Arrow</span></button>
      <div class="sep"></div>
      <button class="tool" data-tool="text" title="Text">🔤<span>Text</span></button>
      <button class="tool" data-tool="pointer" title="Laser pointer">🔴<span>Laser</span></button>
    </div>

    <div id="canvasWrap">
      <div id="boardStage">
        <canvas id="board"></canvas>
        <div id="textInputLayer"></div>
        <div id="pageStamp"></div>
      </div>
    </div>

    <div id="rightpanel">
      <div class="panel-block">
        <h4>Board</h4>
        <div class="board-toggle">
          <div class="board-opt active" data-board="black">
            <div class="swirl" style="background:#14210f;"></div>
            Blackboard
          </div>
          <div class="board-opt" data-board="white">
            <div class="swirl" style="background:#fbfaf6; border:1px solid #ddd;"></div>
            Whiteboard
          </div>
        </div>
      </div>

      <div class="panel-block">
        <h4>Colour</h4>
        <div class="swatches" id="swatches"></div>
        <input type="color" id="customColor" value="#f5f3ec">
      </div>

      <div class="panel-block">
        <h4>Brush size</h4>
        <div class="slider-row">
          <input type="range" id="sizeSlider" min="1" max="40" value="4">
        </div>
        <div id="sizePreviewWrap"><div id="sizePreview"></div></div>
      </div>

      <div class="panel-block" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <h4>Boards (<span id="pageCount">1</span>)</h4>
        <div id="pageThumbs"></div>
      </div>

      <div id="hint">
        Draw with mouse, touch or stylus. Shapes: click-drag from start to end point. Undo/redo per board. Export bundles every board into one PDF, in order.
      </div>
    </div>

  </div>
</div>

<div id="exportOverlay">
  <div class="spinner"></div>
  <p id="exportStatus">Preparing PDF…</p>
</div>

<script>
(function(){
  const boardStage = document.getElementById('boardStage');
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const wrap = document.getElementById('canvasWrap');
  const pageStamp = document.getElementById('pageStamp');
  const textLayer = document.getElementById('textInputLayer');

  const COLORS = ['#f5f3ec','#f4d35e','#ef8f6e','#7fd9c4','#6ea8ef','#ef6e6e','#c792ea','#ffffff'];
  const BOARD_COLORS = { black: '#14210f', white: '#fbfaf6' };
  const LINE_TINT = { black: 'rgba(255,255,255,0.05)', white: 'rgba(20,33,15,0.06)' };

  // ---- State -------------------------------------------------
  let state = {
    tool: 'pen',
    color: '#f5f3ec',
    size: 4,
    boardType: 'black',
    pages: [ makePage() ],
    currentPage: 0
  };

  function makePage(){
    return {
      strokes: [],       // committed drawable objects
      undone: [],        // redo stack
      board: 'black'
    };
  }

  // ---- Canvas sizing ------------------------------------------
  function fitCanvas(){
    // Board is sized to fill the large majority (~80%) of the whole app viewport,
    // with the toolbar + side panel making up the rest.
    const maxW = Math.min(wrap.clientWidth - 16, window.innerWidth * 0.8);
    const maxH = wrap.clientHeight - 16;
    const targetRatio = 16/9;
    let w = maxW, h = w / targetRatio;
    if (h > maxH){ h = maxH; w = h * targetRatio; }
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    renderPage();
  }
  window.addEventListener('resize', fitCanvas);

  // ---- Drawing model -------------------------------------------
  // Each stroke: {tool, color, size, points:[{x,y}...]} for pen/highlighter/eraser
  // or {tool:'line'|'rect'|'circle'|'arrow', color, size, x1,y1,x2,y2}
  // or {tool:'text', color, size, x, y, text, font}

  let drawing = false;
  let currentStroke = null;
  let shapeStart = null;

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function page(){ return state.pages[state.currentPage]; }

  function renderPage(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = BOARD_COLORS[page().board];
    ctx.fillRect(0,0,w,h);
    drawFaintLines(w,h);
    for (const s of page().strokes){ drawStroke(s); }
    if (currentStroke && currentStroke.tool !== 'shape-preview'){
      // live preview handled separately
    }
    updateChrome();
  }

  function drawFaintLines(w,h){
    ctx.save();
    ctx.strokeStyle = LINE_TINT[page().board];
    ctx.lineWidth = 1;
    const gap = 36;
    for (let y = gap; y < h; y += gap){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawStroke(s){
    ctx.save();
    if (s.tool === 'pen' || s.tool === 'highlighter' || s.tool === 'eraser'){
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.lineWidth = s.size;
      if (s.tool === 'eraser'){
        ctx.strokeStyle = BOARD_COLORS[page().board];
        ctx.lineWidth = s.size * 2.2;
      } else if (s.tool === 'highlighter'){
        ctx.strokeStyle = s.color;
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = s.size * 3;
      } else {
        ctx.strokeStyle = s.color;
      }
      ctx.beginPath();
      s.points.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
      ctx.stroke();
    } else if (s.tool === 'line' || s.tool === 'arrow'){
      ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
      if (s.tool === 'arrow'){ drawArrowHead(s.x1,s.y1,s.x2,s.y2,s.color,s.size); }
    } else if (s.tool === 'rect'){
      ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
      ctx.strokeRect(Math.min(s.x1,s.x2), Math.min(s.y1,s.y2), Math.abs(s.x2-s.x1), Math.abs(s.y2-s.y1));
    } else if (s.tool === 'circle'){
      ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
      const rx = Math.abs(s.x2-s.x1)/2, ry = Math.abs(s.y2-s.y1)/2;
      const cx = (s.x1+s.x2)/2, cy = (s.y1+s.y2)/2;
      ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
    } else if (s.tool === 'text'){
      ctx.fillStyle = s.color;
      ctx.font = `${s.size*5}px 'Space Grotesk', sans-serif`;
      ctx.textBaseline = 'top';
      ctx.fillText(s.text, s.x, s.y);
    }
    ctx.restore();
  }

  function drawArrowHead(x1,y1,x2,y2,color,size){
    const angle = Math.atan2(y2-y1, x2-x1);
    const len = 8 + size*1.6;
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - len*Math.cos(angle - Math.PI/7), y2 - len*Math.sin(angle - Math.PI/7));
    ctx.lineTo(x2 - len*Math.cos(angle + Math.PI/7), y2 - len*Math.sin(angle + Math.PI/7));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---- Pointer handling ------------------------------------------
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  let laserTimeout = null;
  function onDown(e){
    e.preventDefault();
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    const pos = getPos(e);
    if (state.tool === 'text'){
      openTextInput(pos);
      return;
    }
    if (state.tool === 'pointer'){
      showLaser(pos);
      return;
    }
    drawing = true;
    if (['pen','highlighter','eraser'].includes(state.tool)){
      currentStroke = { tool: state.tool, color: state.color, size: state.size, points: [pos] };
    } else {
      shapeStart = pos;
      currentStroke = { tool: state.tool, color: state.color, size: state.size, x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y };
    }
  }

  function onMove(e){
    if (state.tool === 'pointer' && e.buttons === 1){ showLaser(getPos(e)); return; }
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    if (['pen','highlighter','eraser'].includes(state.tool)){
      currentStroke.points.push(pos);
      renderPage();
      drawStroke(currentStroke);
    } else {
      currentStroke.x2 = pos.x; currentStroke.y2 = pos.y;
      renderPage();
      drawStroke(currentStroke);
    }
  }

  function onUp(e){
    if (!drawing || !currentStroke) { drawing = false; return; }
    drawing = false;
    page().strokes.push(currentStroke);
    page().undone = [];
    currentStroke = null;
    renderPage();
    saveThumb();
  }

  function showLaser(pos){
    let dotEl = document.getElementById('laserDot');
    if (!dotEl){
      dotEl = document.createElement('div');
      dotEl.id = 'laserDot';
      dotEl.style.position = 'absolute';
      dotEl.style.width = '14px';
      dotEl.style.height = '14px';
      dotEl.style.borderRadius = '50%';
      dotEl.style.background = 'radial-gradient(circle, #ff5252 0%, rgba(255,82,82,0) 70%)';
      dotEl.style.boxShadow = '0 0 12px 4px rgba(255,82,82,0.8)';
      dotEl.style.pointerEvents = 'none';
      dotEl.style.transform = 'translate(-50%,-50%)';
      boardStage.appendChild(dotEl);
    }
    dotEl.style.left = pos.x + 'px';
    dotEl.style.top = pos.y + 'px';
    dotEl.style.opacity = '1';
    clearTimeout(laserTimeout);
    laserTimeout = setTimeout(()=>{ dotEl.style.transition='opacity .4s'; dotEl.style.opacity='0'; }, 500);
  }

  // ---- Text tool ------------------------------------------------
  function openTextInput(pos){
    const input = document.createElement('input');
    input.type = 'text';
    input.style.left = pos.x + 'px';
    input.style.top = pos.y + 'px';
    input.style.fontSize = (state.size*5) + 'px';
    input.style.color = state.color;
    textLayer.appendChild(input);
    input.focus();
    function commit(){
      const val = input.value.trim();
      if (val){
        page().strokes.push({ tool:'text', color: state.color, size: state.size, x: pos.x, y: pos.y + state.size*0.6, text: val });
        page().undone = [];
        renderPage();
        saveThumb();
      }
      input.remove();
    }
    input.addEventListener('keydown', ev=>{ if (ev.key==='Enter'){ commit(); } if (ev.key==='Escape'){ input.remove(); } });
    input.addEventListener('blur', commit);
  }

  // ---- Toolbar interactions ---------------------------------------
  document.querySelectorAll('.tool').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.tool = btn.dataset.tool;
      canvas.style.cursor = state.tool === 'eraser' ? 'cell' : (state.tool === 'text' ? 'text' : 'crosshair');
    });
  });

  const swatchesEl = document.getElementById('swatches');
  COLORS.forEach((c,i)=>{
    const el = document.createElement('div');
    el.className = 'swatch' + (i===0 ? ' active' : '');
    el.style.background = c;
    el.addEventListener('click', ()=>{
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      el.classList.add('active');
      state.color = c;
      document.getElementById('customColor').value = c;
    });
    swatchesEl.appendChild(el);
  });
  document.getElementById('customColor').addEventListener('input', (e)=>{
    state.color = e.target.value;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  });

  const sizeSlider = document.getElementById('sizeSlider');
  const sizePreview = document.getElementById('sizePreview');
  function updateSizePreview(){
    const s = Math.max(4, Math.min(34, state.size*1.4));
    sizePreview.style.width = s+'px';
    sizePreview.style.height = s+'px';
  }
  sizeSlider.addEventListener('input', e=>{ state.size = parseInt(e.target.value,10); updateSizePreview(); });
  updateSizePreview();

  document.querySelectorAll('.board-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      document.querySelectorAll('.board-opt').forEach(o=>o.classList.remove('active'));
      opt.classList.add('active');
      page().board = opt.dataset.board;
      renderPage();
      saveThumb();
    });
  });

  // ---- Undo / Redo / Clear ---------------------------------------
  document.getElementById('undoBtn').addEventListener('click', ()=>{
    const p = page();
    if (p.strokes.length){
      p.undone.push(p.strokes.pop());
      renderPage();
      saveThumb();
    }
  });
  document.getElementById('redoBtn').addEventListener('click', ()=>{
    const p = page();
    if (p.undone.length){
      p.strokes.push(p.undone.pop());
      renderPage();
      saveThumb();
    }
  });
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    if (!confirm('Clear this board? This cannot be undone.')) return;
    page().strokes = [];
    page().undone = [];
    renderPage();
    saveThumb();
  });

  // keyboard shortcuts
  window.addEventListener('keydown', e=>{
    if (e.target.tagName === 'INPUT') return;
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); document.getElementById('undoBtn').click(); }
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); document.getElementById('redoBtn').click(); }
  });

  // ---- Pages ------------------------------------------------------
  const pageLabel = document.getElementById('pageLabel');
  const prevBtn = document.getElementById('prevPage');
  const nextBtn = document.getElementById('nextPage');
  const pageCountEl = document.getElementById('pageCount');
  const pageThumbs = document.getElementById('pageThumbs');

  function updateChrome(){
    pageLabel.textContent = `Page ${state.currentPage+1} / ${state.pages.length}`;
    pageStamp.textContent = `${state.currentPage+1} / ${state.pages.length}`;
    pageStamp.style.color = page().board === 'black' ? 'rgba(255,255,255,0.55)' : 'rgba(20,33,15,0.55)';
    pageStamp.style.background = page().board === 'black' ? 'rgba(255,255,255,0.07)' : 'rgba(20,33,15,0.06)';
    prevBtn.disabled = state.currentPage === 0;
    nextBtn.disabled = state.currentPage === state.pages.length - 1;
    pageCountEl.textContent = state.pages.length;
    document.querySelectorAll('.board-opt').forEach(o=>o.classList.toggle('active', o.dataset.board === page().board));
  }

  function switchTo(idx){
    state.currentPage = idx;
    renderPage();
    refreshThumbs();
  }

  prevBtn.addEventListener('click', ()=>{ if (state.currentPage>0) switchTo(state.currentPage-1); });
  nextBtn.addEventListener('click', ()=>{ if (state.currentPage < state.pages.length-1) switchTo(state.currentPage+1); });

  document.getElementById('addPageBtn').addEventListener('click', ()=>{
    const np = makePage();
    np.board = page().board;
    state.pages.splice(state.currentPage+1, 0, np);
    switchTo(state.currentPage+1);
  });

  function refreshThumbs(){
    pageThumbs.innerHTML = '';
    state.pages.forEach((p, idx)=>{
      const row = document.createElement('div');
      row.className = 'thumb' + (idx===state.currentPage ? ' active' : '');
      const img = document.createElement('canvas');
      img.className = 'thumb-canvas';
      renderThumbCanvas(img, p);
      const label = document.createElement('div');
      label.className = 'thumb-label';
      label.textContent = 'Board ' + (idx+1);
      const del = document.createElement('button');
      del.className = 'thumb-del';
      del.textContent = '✕';
      del.title = 'Delete board';
      del.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if (state.pages.length === 1){ alert('At least one board is required.'); return; }
        if (!confirm('Delete this board?')) return;
        state.pages.splice(idx,1);
        if (state.currentPage >= state.pages.length) state.currentPage = state.pages.length-1;
        else if (idx < state.currentPage) state.currentPage--;
        switchTo(state.currentPage);
      });
      row.appendChild(img);
      row.appendChild(label);
      row.appendChild(del);
      row.addEventListener('click', ()=> switchTo(idx));
      pageThumbs.appendChild(row);
    });
  }

  function renderThumbCanvas(el, p){
    const w = 120, h = 76;
    el.width = w; el.height = h;
    const tctx = el.getContext('2d');
    tctx.fillStyle = BOARD_COLORS[p.board];
    tctx.fillRect(0,0,w,h);
    const scaleX = w / canvas.clientWidth;
    const scaleY = h / canvas.clientHeight;
    tctx.save();
    tctx.scale(scaleX, scaleY);
    for (const s of p.strokes){
      drawStrokeOnCtx(tctx, s, p.board);
    }
    tctx.restore();
  }

  function drawStrokeOnCtx(tctx, s, boardType){
    tctx.save();
    if (s.tool === 'pen' || s.tool === 'highlighter' || s.tool === 'eraser'){
      tctx.lineJoin='round'; tctx.lineCap='round'; tctx.lineWidth = s.size;
      if (s.tool==='eraser'){ tctx.strokeStyle = BOARD_COLORS[boardType]; tctx.lineWidth = s.size*2.2; }
      else if (s.tool==='highlighter'){ tctx.strokeStyle = s.color; tctx.globalAlpha=0.35; tctx.lineWidth = s.size*3; }
      else { tctx.strokeStyle = s.color; }
      tctx.beginPath();
      s.points.forEach((p,i)=> i===0 ? tctx.moveTo(p.x,p.y) : tctx.lineTo(p.x,p.y));
      tctx.stroke();
    } else if (s.tool==='line' || s.tool==='arrow'){
      tctx.strokeStyle = s.color; tctx.lineWidth = s.size; tctx.lineCap='round';
      tctx.beginPath(); tctx.moveTo(s.x1,s.y1); tctx.lineTo(s.x2,s.y2); tctx.stroke();
    } else if (s.tool==='rect'){
      tctx.strokeStyle = s.color; tctx.lineWidth = s.size;
      tctx.strokeRect(Math.min(s.x1,s.x2), Math.min(s.y1,s.y2), Math.abs(s.x2-s.x1), Math.abs(s.y2-s.y1));
    } else if (s.tool==='circle'){
      tctx.strokeStyle = s.color; tctx.lineWidth = s.size;
      const rx=Math.abs(s.x2-s.x1)/2, ry=Math.abs(s.y2-s.y1)/2, cx=(s.x1+s.x2)/2, cy=(s.y1+s.y2)/2;
      tctx.beginPath(); tctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); tctx.stroke();
    } else if (s.tool==='text'){
      tctx.fillStyle = s.color;
      tctx.font = `${s.size*5}px sans-serif`;
      tctx.textBaseline='top';
      tctx.fillText(s.text, s.x, s.y);
    }
    tctx.restore();
  }

  function saveThumb(){ refreshThumbs(); }

  // ---- Export to PDF ------------------------------------------------
  document.getElementById('exportBtn').addEventListener('click', exportPDF);

  async function exportPDF(){
    const overlay = document.getElementById('exportOverlay');
    const status = document.getElementById('exportStatus');
    overlay.classList.add('show');
    await new Promise(r=>setTimeout(r,50));

    try{
      const { jsPDF } = window.jspdf;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const pdf = new jsPDF({ orientation: w > h ? 'landscape' : 'portrait', unit: 'pt', format: [w, h] });

      for (let i=0; i<state.pages.length; i++){
        status.textContent = `Rendering board ${i+1} of ${state.pages.length}…`;
        await new Promise(r=>setTimeout(r,10));

        const off = document.createElement('canvas');
        const dpr = window.devicePixelRatio || 1;
        off.width = w*dpr; off.height = h*dpr;
        const octx = off.getContext('2d');
        octx.setTransform(dpr,0,0,dpr,0,0);
        const p = state.pages[i];
        octx.fillStyle = BOARD_COLORS[p.board];
        octx.fillRect(0,0,w,h);
        for (const s of p.strokes){ drawStrokeOnCtx(octx, s, p.board); }
        // page number stamp
        octx.fillStyle = p.board === 'black' ? 'rgba(255,255,255,0.5)' : 'rgba(20,33,15,0.5)';
        octx.font = '12px sans-serif';
        octx.fillText(`${i+1} / ${state.pages.length}`, w-58, h-16);

        const imgData = off.toDataURL('image/jpeg', 0.92);
        if (i>0) pdf.addPage([w,h], w > h ? 'landscape' : 'portrait');
        pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
      }
      status.textContent = 'Saving…';
      await new Promise(r=>setTimeout(r,150));
      pdf.save('teach-board-' + new Date().toISOString().slice(0,10) + '.pdf');
    } catch(err){
      alert('PDF export failed: ' + err.message);
      console.error(err);
    } finally {
      overlay.classList.remove('show');
    }
  }

  // ---- Init -----------------------------------------------------
  fitCanvas();
  refreshThumbs();
  updateSizePreview();
})();
</script>
</body>
</html>
